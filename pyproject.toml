[project]
name = "telemetry-lakehouse"
version = "0.1.0"
description = "Integrity-gated streaming-to-Parquet telemetry pipeline with atomic manifest publication."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "pyarrow>=18",
    "pydantic>=2.8",
]

[project.scripts]
telemetry = "telemetry_lakehouse.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/telemetry_lakehouse"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"

[tool.ruff.lint.per-file-ignores]
# Embedded SQL and long diagnostic strings read better unwrapped.
"src/telemetry_lakehouse/manifest.py" = ["E501"]
"src/telemetry_lakehouse/verify.py" = ["E501"]
"src/telemetry_lakehouse/benchmark.py" = ["E501"]  # markdown table rows
"benchmarks/*.py" = ["E501"]
"scripts/*.py" = ["E501"]
