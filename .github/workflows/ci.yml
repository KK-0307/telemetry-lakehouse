name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --python 3.14
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    name: Tests (Python ${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --python ${{ matrix.python }}
      # Includes the failure-injection tests that kill real subprocesses (os._exit) mid-protocol.
      - run: uv run pytest -q

  demo:
    name: End-to-end demo (Definition of Done)
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --python 3.14
      # Smaller than the local default so CI stays fast; every expectation is still machine-checked.
      - run: EVENTS=30000 RUN_TESTS=0 RUN_BENCH=0 scripts/demo.sh

  benchmark-smoke:
    name: Benchmark harness smoke test
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --python 3.14
      # Proves the harness runs end to end. CI numbers are NOT comparable to docs/benchmarks.md.
      - run: uv run telemetry benchmark --events 50000 --repeats 1 --label ci-smoke --out-dir benchmarks/results
